# ── Eviction experiment configuration ─────────────────────────────
# Used by scripts/08_run_eviction.py

cache:
  index_type: hnsw
  index_params:
    M: 32
    efConstruction: 128
    efSearch: 128
  cache_sizes_pct: [0.10, 0.20, 0.30]  # fraction of unique queries

eviction:
  policies: [lru, lfu, semantic]
  oracle:
    refresh_interval: 5000            # full future-use rebuild every N evictions (was 100)
    horizon: 50000                    # bounded lookahead: only search next 50K stream queries
                                      # instead of entire remaining stream. 0 = unlimited.
                                      # Reduces refresh from O(S×C) to O(horizon×C).
  semantic:
    similarity_threshold: 0.90        # L2² threshold — matches hit_threshold so two
                                    # cached entries are neighbours iff one would be
                                    # a cache hit for the other (cosine ≥ 0.55).
                                    # Must satisfy: similarity_threshold ≤ hit_threshold.
    alpha: 1.0                        # recency weight
    beta: 1.0                         # frequency weight
    mu: 0.1                           # Eventual-evictability / LRU+LFU blend constant
    dynamic_impute: true              # Symmetric online neighbour-graph updates on insert
    recompute_interval: 2000          # Full graph rebuild every N evictions (online updates keep it fresh between)
  adaptive:
    similarity_threshold: 0.90        # L2² density threshold for adaptive semantic signal
    recompute_interval: 2000
    max_redundancy_samples: 1024
    density_history_size: 64
    density_threshold_scale: 1.0      # dynamic threshold = median + scale * MAD
    density_floor: 0.0001             # prevents semantic mode on pure numerical noise
    frequency_skew_threshold: 1.5     # LFU mode/weight turns on above this skew
    min_observations: 50
    dynamic_impute: true
  adaptive_blend:
    base_recency_weight: 1.0
    max_frequency_weight: 1.0
    max_semantic_weight: 2.0

evaluation:
  warmup_pct: 0.30                    # first 30% of queries warm up the cache
  hit_threshold: 0.90                 # L2² hit threshold for lookup
  rolling_window: 1000               # window size for rolling hit rate
  log_interval: 500                   # log progress every N queries
  workloads: [temporal]               # temporal = chronological order (default)

seed: 42
seeds: [42, 123, 456]
